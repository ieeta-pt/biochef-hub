# biochef-hub/.github/workflows/validate-recipes.yml
name: Validate BioChef Recipes
on:
  workflow_call:
    inputs:
      recipes:
        required: true
        type: string
      hub_ref:
        required: false
        type: string
        default: master

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      REGISTRY_DIR: registry
      EMSDK_VERSION: "4.0.18"
      EMSDK_COMMIT: "eb5eb4b3b2b792f44ded198bfe615c985da5be2c"

    steps:
      - name: Checkout caller recipes
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Checkout hub source into .hub/
        uses: actions/checkout@v4
        with:
          repository: ieeta-pt/biochef-hub
          ref: ${{ inputs.hub_ref }}
          path: .hub
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node
        # The parity harness runs the published WASM build, and the published
        # WASM build is JavaScript plus a .wasm file. There is no way to execute
        # one without a JS runtime.
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ./.hub/hub/requirements.txt

      - name: Install pinned Emscripten
        run: |
          sudo apt update
          sudo apt install -y cmake python3 python3-pip nodejs npm
          git clone https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          git -C "$RUNNER_TEMP/emsdk" checkout "$EMSDK_COMMIT"
          "$RUNNER_TEMP/emsdk/emsdk" install "$EMSDK_VERSION"
          "$RUNNER_TEMP/emsdk/emsdk" activate "$EMSDK_VERSION"

      - name: Validate, Build and Test recipes
        env:
          RECIPE_PATHS: ${{ inputs.recipes }}
        run: |
          REQUESTED_EMSDK_VERSION="$EMSDK_VERSION"
          REQUESTED_EMSDK_COMMIT="$EMSDK_COMMIT"
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          export EMSDK_VERSION="$REQUESTED_EMSDK_VERSION"
          export EMSDK_COMMIT="$REQUESTED_EMSDK_COMMIT"
          read -r -a recipe_paths <<< "$RECIPE_PATHS"
          if [ "${#recipe_paths[@]}" -eq 0 ]; then
            echo "No recipe paths were provided"
            exit 1
          fi
          python ./.hub/hub/hub.py validate "${recipe_paths[@]}"
          python ./.hub/hub/hub.py build
          python ./.hub/hub/hub.py test

      - name: Check the parity harness can still see a divergence
        # Before trusting the report below. These checks need no toolchain and
        # take no time, and they are the difference between "the catalogue
        # agrees" and "the comparison stopped comparing".
        run: python ./.hub/hub/hub.py parity --self-test

      - name: Compare the WASM and native builds
        # Every recipe declaring both runtimes promises an operation means the
        # same thing either way. Until now nothing checked it: the existing
        # tests run runtime/native only, and pass by skipping when it is absent.
        #
        # No --min-compared here on purpose. A pull request may touch only
        # single-runtime recipes and legitimately have nothing to compare; what
        # fails this step is a recipe that DECLARED both and could not be
        # compared anyway, which the harness treats as a problem by itself.
        run: |
          python ./.hub/hub/hub.py parity \
            --registry-dir "$REGISTRY_DIR" \
            --report parity-report.json

      - name: Keep the parity report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parity-report
          path: parity-report.json
          if-no-files-found: ignore

      - name: Generate CycloneDX SBOMs
        run: |
          python ./.hub/hub/hub.py sbom --registry-dir "$REGISTRY_DIR"

      - name: Run strict SBOM evidence check
        run: |
          python ./.hub/hub/hub.py sbom-check --registry-dir "$REGISTRY_DIR"
